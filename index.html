<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Máster IA Aplicativa · Test</title>
<style>
:root{--ink:#171724;--muted:#747687;--line:#e8e5ef;--vio:#8e5cff;--blue:#5b6cff;--aqua:#28d7c0;--yellow:#ffd84a;--coral:#ff715f;--lime:#bdf34a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(#fffaf5,#f6f5ff);min-height:100vh}.app{max-width:480px;margin:auto;padding-bottom:92px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fffaf5eF;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.brand{font-weight:800}.sub{font-size:11px;color:var(--muted)}main{padding:0 14px}.screen{display:none}.screen.active{display:block}.hero{padding:26px 2px 16px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--vio)}h1{font-size:39px;line-height:1.02;margin:8px 0 12px}h2{font-size:26px;margin:6px 0 10px}p{line-height:1.5;color:var(--muted)}.scene{background:#fff;border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 18px 44px #221c4415}.blue{background:linear-gradient(145deg,#6878ff,#5362ee);color:#fff;border:0}.blue p{color:#fff}.btn{width:100%;min-height:52px;border:0;border-radius:17px;padding:14px 16px;font-weight:800;background:var(--ink);color:#fff}.btn.white{background:#fff;color:var(--ink)}.stats{display:flex;gap:10px;margin-top:12px}.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.stat b{font-size:26px}.nav{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),456px);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#ffffffef;border:1px solid var(--line);padding:7px;border-radius:22px}.nav button{border:0;background:transparent;min-height:50px;border-radius:16px;font-weight:800;color:var(--muted)}.nav button.active{background:var(--ink);color:#fff}
.pipo-row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:end;margin:8px 0 16px}.pipo{position:relative;width:78px;height:82px}.head{position:absolute;left:8px;top:22px;width:62px;height:56px;border-radius:45%;background:#c99768}.ear{position:absolute;top:30px;width:22px;height:30px;background:#5f402f;border-radius:55%}.ear.l{left:0}.ear.r{right:0}.eye{position:absolute;top:18px;width:12px;height:13px;background:#211916;border-radius:50%}.eye.l{left:12px}.eye.r{right:12px}.muzzle{position:absolute;left:16px;top:31px;width:30px;height:21px;border-radius:48%;background:#6d4936}.nose{position:absolute;left:10px;top:1px;width:11px;height:7px;background:#171311;border-radius:50%}.hat{position:absolute;top:2px;left:14px;width:50px;height:27px;background:#ef3e3e;border-radius:18px 18px 7px 7px;z-index:3}.hat:after{content:"";position:absolute;left:-8px;bottom:-5px;width:66px;height:9px;background:#d92a2a;border-radius:99px}.collar{position:absolute;left:18px;bottom:0;width:44px;height:8px;background:#2f66ff;border-radius:99px}.speech{background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 7px;padding:13px 14px;line-height:1.45;font-size:14px}.speech strong{display:block;margin-bottom:3px}.react{animation:bounce .6s ease}@keyframes bounce{35%{transform:translateY(-7px) rotate(-4deg)}70%{transform:rotate(4deg)}}
.lessonTop{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.progress{display:flex;gap:5px;margin-bottom:14px}.progress span{height:6px;flex:1;border-radius:99px;background:#e4e2eb}.progress .done{background:var(--aqua)}.progress .cur{background:var(--vio)}.card{min-height:500px;border-radius:30px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;animation:slide .35s ease;box-shadow:0 18px 44px #221c4415}.hook{background:linear-gradient(145deg,#8e5cff,#ad79ff);color:#fff}.vocab{background:linear-gradient(145deg,#ffd84a,#ffeb92)}.concept{background:linear-gradient(145deg,#6274ff,#5362ee);color:#fff}.example{background:linear-gradient(145deg,#28d7c0,#83eadf)}.game{background:linear-gradient(145deg,#ff715f,#ffa193);color:#fff}.trap{background:linear-gradient(145deg,#ff9b8c,#ffd4cc)}.recap{background:linear-gradient(145deg,#bdf34a,#e2ff9e)}@keyframes slide{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}.card h2{font-size:31px;line-height:1.04}.answers{display:grid;gap:9px;margin-top:14px}.answer{min-height:54px;border:1px solid #17172420;border-radius:16px;background:#fff;text-align:left;padding:14px;font-weight:800}.answer.ok{background:#efffdf;border-color:#8dcc55}.answer.bad{background:#fff0ec;border-color:#ff8f80}.feedback{margin-top:12px;padding:13px;border-radius:15px;background:#ffffffd9;color:var(--ink);font-weight:700}.word{font-size:42px;font-weight:900;margin:10px 0}.chip{display:inline-block;padding:7px 10px;border-radius:99px;background:#ffffff88;font-size:12px;font-weight:800}.exampleBox{padding:12px;border-radius:15px;background:#ffffff88;margin-top:10px;line-height:1.45}.route{position:relative;padding-left:22px}.route:before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:3px;background:linear-gradient(var(--blue),var(--vio),var(--aqua),var(--coral),var(--yellow));border-radius:99px}.module{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px}.module:before{content:"";position:absolute;left:-22px;top:21px;width:16px;height:16px;border:4px solid var(--c,var(--blue));background:#fff;border-radius:50%}.module.locked{opacity:.65}.overlay{position:fixed;inset:0;background:#17172470;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(100%,420px);background:#fff;border-radius:28px;padding:22px}.modal input{width:100%;height:52px;border:1px solid var(--line);border-radius:15px;padding:0 14px;font-size:16px}
</style></head><body>
<div class="app"><header class="top"><div><div class="brand">✦ Máster IA Aplicativa</div><div class="sub">Test · M1 interactivo</div></div><button id="gear">⚙</button></header><main><section id="home" class="screen active"></section><section id="route" class="screen"></section><section id="lesson" class="screen"></section><section id="progress" class="screen"></section></main></div>
<nav class="nav"><button data-s="home" class="active">⌂<br>Inicio</button><button data-s="route">◇<br>Ruta</button><button data-s="progress">↗<br>Progreso</button></nav>
<div id="nameModal" class="overlay"><div class="modal"><div class="eyebrow">Antes de empezar</div><h2>¿Cómo te llamas?</h2><p>Solo tu nombre. Nada más.</p><input id="nameInput" placeholder="Tu nombre"><button id="saveName" class="btn" style="margin-top:14px">Empezar</button></div></div>
<div id="settings" class="overlay"><div class="modal"><h2>Ajustes</h2><p>Sonido pensado para iPhone: toca “Probar sonido” una vez.</p><button id="testSound" class="btn">🔊 Probar sonido</button><button id="closeSettings" class="btn" style="margin-top:10px">Cerrar</button></div></div>
<script>
const K="master_ia_test_cards_v1";
let st={name:"",screen:"home",card:0,word:0,revealed:false,answers:{},done:false,...JSON.parse(localStorage.getItem(K)||"{}")};
const cards=[
{t:"hook",label:"EMPEZAMOS FÁCIL",title:"Tres palabras que vas a escuchar muchísimo",copy:"Chatbot, automatización y agente parecen similares, pero hacen cosas distintas. Primero vamos a entenderlas sin memorizar de golpe.",pipo:"Voy contigo paso a paso. Primero entendemos; después jugamos."},
{t:"vocab",label:"PALABRAS CLAVE",title:"Descubre el vocabulario",words:[
["IA","Tecnología capaz de interpretar información, reconocer patrones, generar contenido o apoyar decisiones.","Puede resumir un documento o generar texto.","No significa que piense exactamente como una persona."],
["Chatbot","Sistema diseñado para conversar contigo mediante mensajes.","Le preguntas por PLA y PETG y te responde.","Conversar no significa actuar por su cuenta."],
["Automatización","Proceso que sigue pasos y reglas definidos de antemano.","Entra un pedido → se envía una confirmación.","Piensa: si pasa A, haz B."],
["Agente","Sistema con un objetivo que puede elegir entre varias acciones según la situación.","Falta el color → decide preguntarlo.","La pista importante es la decisión."],
["Regla","Condición definida previamente que indica qué debe ocurrir.","Si el pago está confirmado, enviar a producción.","La regla ya estaba escrita antes."],
["Decisión","Elegir entre acciones posibles según lo que está pasando.","Continuar, preguntar o mandar a revisión.","Aquí el camino puede cambiar."],
["Objetivo","Resultado que queremos conseguir.","Dejar un pedido listo para presupuestar.","Un agente necesita saber hacia dónde va."]
]},
{t:"concept",label:"IDEA CENTRAL",title:"La diferencia que importa",copy:"Un chatbot conversa. Una automatización sigue un camino definido. Un agente puede decidir qué acción tomar para acercarse a un objetivo.",pipo:"Hack de IA: busca una decisión. Si el camino puede cambiar según la situación, presta atención."},
{t:"example",label:"TRES MUNDOS",title:"Mismo concepto, tres contextos",examples:["Vida diaria: preguntas la hora de cierre → chatbot.","Trabajo: entra un formulario y se manda siempre el mismo email → automatización.","REG3D: falta el color y el sistema decide pedirlo → agente."]},
{t:"game",label:"JUEGO · ¿QUIÉN HA SIDO?",title:"Cada compra genera automáticamente una factura.",a:["Chatbot","Automatización","Agente"],ok:1,yes:"Exacto. No hay decisión: ocurre A y se ejecuta B.",no:"Casi. Pregúntate si el sistema tuvo que elegir entre varios caminos."},
{t:"trap",label:"LA TRAMPA",title:"Una automatización usa IA para escribir un email. ¿Ahora es un agente?",a:["Sí, porque usa IA","No necesariamente"],ok:1,yes:"Correcto. Puede seguir siendo un flujo fijo aunque use IA.",no:"Usar IA no basta. La clave es si decide qué hacer."},
{t:"game",label:"SEGUNDO CASO",title:"Un pedido llega incompleto y el sistema decide qué dato pedir primero.",a:["Chatbot","Automatización","Agente"],ok:2,yes:"Sí. Hay una decisión basada en el estado del pedido.",no:"Fíjate en la palabra “decide”."},
{t:"recap",label:"QUÉDATE CON ESTO",title:"Chatbot responde · Automatización ejecuta · Agente decide",copy:"No memorices una frase perfecta. Reconoce la función en situaciones reales.",pipo:"Si ya puedes distinguirlos en un caso real, la base está funcionando."}
];
function save(){localStorage.setItem(K,JSON.stringify(st))}
function pipo(msg){return `<div class="pipo-row"><div class="pipo"><div class="hat"></div><div class="ear l"></div><div class="ear r"></div><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="muzzle"><div class="nose"></div></div></div><div class="collar"></div></div><div class="speech"><strong>Pipo · experto en IA</strong>${msg}</div></div>`}
let ac=null;function unlock(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ac)ac=new C();if(ac.state==="suspended")ac.resume()}
function tone(f,d=.1,g=.12,delay=0){unlock();if(!ac)return;const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime+delay;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function ding(){tone(520,.1,.13);tone(720,.13,.11,.08)}function nope(){tone(210,.13,.1);tone(170,.12,.07,.09)}function tap(){tone(420,.06,.06)}function finish(){tone(523,.1,.11);tone(659,.1,.11,.08);tone(784,.18,.12,.16)}
document.addEventListener("pointerdown",unlock,{once:true});
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.s===id));st.screen=id;save();scrollTo(0,0)}
function home(){document.getElementById("home").innerHTML=`<div class="hero"><div class="eyebrow">Tu aprendizaje</div><h1>Hola, ${(st.name||"amigo").split(" ")[0]}.<br>Vamos a entender IA de verdad.</h1><p>Más concepto antes de jugar, pero explicado en tarjetas rápidas.</p></div>${pipo("Soy tu guía experto en IA. Si algo parece técnico, lo explicamos con ejemplos.")}<div class="scene blue"><div class="eyebrow" style="color:#fff">MÓDULO 1</div><h2>Chatbot, automatización o agente</h2><p>Palabras clave interactivas + ejemplos + juegos.</p><button id="start" class="btn white">Empezar lección →</button></div><div class="stats"><div class="stat">Progreso<br><b>${st.done?"100":"0"}%</b></div><div class="stat">Tarjetas<br><b>${cards.length}</b></div></div>`;start.onclick=()=>{st.card=0;st.word=0;st.revealed=false;save();lesson();show("lesson")}}
function route(){document.getElementById("route").innerHTML=`<div class="hero"><div class="eyebrow">Ruta</div><h1>De entender IA a construir con ella.</h1></div>${pipo("Primero cerramos bien la base. Después seguimos con prompting, contexto y el resto.")}<div class="route">${["01|Entender la IA|Disponible|#5b6cff","02|Prompting profesional|Ruta lista|#8e5cff","03|Contexto y archivos|Ruta lista|#28d7c0","04|Search + Deep Research|Ruta lista|#5b6cff","05|Data Analysis|Ruta lista|#b0dc35","06|IA Visual|Ruta lista|#ff715f","07|Tasks + Work|Demo|#8e5cff","08|Tools y conexiones|Ruta lista|#28d7c0","09|Desarrollo con IA|Ruta lista|#5b6cff","10|Automatización y APIs|Ruta lista|#ff715f","11|Agentes|Ruta lista|#8e5cff","12|AI Product Design|Ruta lista|#b0dc35"].map((x,i)=>{let [n,t,s,c]=x.split("|");return `<div class="module ${i?"locked":""}" style="--c:${c}"><small>MÓDULO ${n}</small><h3>${t}</h3><p>${s}</p></div>`}).join("")}</div>`}
function lesson(){
const c=cards[st.card],cls=c.t;let b=`<div><div class="eyebrow" style="color:inherit">${c.label}</div><h2>${c.title}</h2>`;
if(c.copy)b+=`<p style="color:inherit">${c.copy}</p>`;
if(c.examples)b+=c.examples.map(x=>`<div class="exampleBox">${x}</div>`).join("");
if(c.t==="vocab"){const w=c.words[st.word];b+=`<span class="chip">Palabra ${st.word+1}/${c.words.length}</span><div class="word">${w[0]}</div>`;if(!st.revealed)b+=`<p style="color:inherit">Toca para descubrir qué significa.</p><button id="reveal" class="btn">Descubrir</button>`;else b+=`<p style="color:inherit;font-size:17px">${w[1]}</p><div class="exampleBox"><b>Ejemplo:</b> ${w[2]}</div>${pipo(w[3])}<button id="nextWord" class="btn">${st.word===c.words.length-1?"Terminar palabras clave →":"Siguiente palabra →"}</button>`}
if(c.a){const chosen=st.answers[st.card];b+=`<div class="answers">${c.a.map((x,i)=>`<button class="answer ${chosen!==undefined?(i===c.ok?"ok":i===chosen?"bad":""):""}" data-a="${i}" ${chosen!==undefined?"disabled":""}>${x}</button>`).join("")}</div>`;if(chosen!==undefined)b+=`<div class="feedback">${chosen===c.ok?"✓ "+c.yes:"↺ "+c.no}</div>${pipo(chosen===c.ok?"Bien visto. Esa es la lógica.":"Casi. Revisa la pista y prueba otra vez.")}`}
if(c.pipo&&c.t!=="vocab")b+=pipo(c.pipo);b+=`</div>`;
const can=c.t==="vocab"?(st.revealed&&st.word===c.words.length-1):(c.a?st.answers[st.card]===c.ok:true);
document.getElementById("lesson").innerHTML=`<div class="lessonTop"><button id="back">← Ruta</button><b>${st.card+1}/${cards.length}</b></div><div class="progress">${cards.map((_,i)=>`<span class="${i<st.card?"done":i===st.card?"cur":""}"></span>`).join("")}</div><div class="card ${cls}">${b}<div>${c.t!=="vocab"?`<button id="next" class="btn ${["hook","concept","game"].includes(c.t)?"white":""}" ${!can?"disabled style='opacity:.45'":""}>${st.card===cards.length-1?"Completar ✨":"Siguiente tarjeta →"}</button>`:""}</div></div>`;
back.onclick=()=>{tap();route();show("route")};
document.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>{const v=+x.dataset.a;st.answers[st.card]=v;save();if(v===c.ok)ding();else{nope();setTimeout(()=>{delete st.answers[st.card];save()},900)}lesson()});
if(window.reveal)reveal.onclick=()=>{tap();st.revealed=true;save();lesson()};
if(window.nextWord)nextWord.onclick=()=>{tap();if(st.word<c.words.length-1){st.word++;st.revealed=false;save();lesson()}else nextCard()};
if(window.next)next.onclick=()=>{if(can)nextCard()};
}
function nextCard(){if(st.card<cards.length-1){tap();st.card++;st.word=0;st.revealed=false;save();lesson();scrollTo(0,0)}else{st.done=true;save();finish();progress();show("progress")}}
function progress(){document.getElementById("progress").innerHTML=`<div class="hero"><div class="eyebrow">Progreso</div><h1>${st.done?"100":"0"}% de la lección piloto</h1><p>Este porcentaje prueba el sistema. Luego el progreso se calculará por lecciones reales.</p></div>${pipo(st.done?"Muy bien. Ya probaste la nueva forma de aprender por tarjetas.":"Completa la lección piloto para ver el progreso.")}`}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tap();if(b.dataset.s==="home")home();if(b.dataset.s==="route")route();if(b.dataset.s==="progress")progress();show(b.dataset.s)});
gear.onclick=()=>settings.classList.add("show");closeSettings.onclick=()=>settings.classList.remove("show");testSound.onclick=()=>{unlock();finish()};
saveName.onclick=()=>{let v=nameInput.value.trim();if(!v)return;st.name=v;save();nameModal.classList.remove("show");ding();home()};
home();route();progress();show(st.screen==="lesson"?"home":st.screen);if(!st.name)nameModal.classList.add("show");
</script></body></html>
