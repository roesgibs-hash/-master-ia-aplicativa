const KEY='masterIA_v1_state';

const D={
currentModule:'m1',
currentLesson:'m1l1',
completed:[],
checks:{},
notes:{},
quiz:null,
chat:[]
};

let S=Object.assign(
{},
D,
JSON.parse(localStorage.getItem(KEY)||'{}')
);

const A=()=>M.flatMap(
m=>m.lessons.map(
l=>({...l,moduleId:m.id,moduleTitle:m.title})
)
);

const L=()=>A().find(
x=>x.id===S.currentLesson
)||A()[0];

const P=()=>Math.round(
S.completed.length/A().length*100
);

const MP=m=>Math.round(
m.lessons.filter(
x=>S.completed.includes(x.id)
).length/m.lessons.length*100
);

function save(){
localStorage.setItem(KEY,JSON.stringify(S));
let b=document.getElementById('save');
b.textContent='Guardado ✓';
setTimeout(()=>b.textContent='Guardado local',800);
}

function toast(t){
let e=document.getElementById('toast');
e.textContent=t;
e.classList.add('show');
setTimeout(()=>e.classList.remove('show'),1400);
}

function show(id){
document.querySelectorAll('.screen').forEach(
x=>x.classList.remove('active')
);

document.getElementById(id).classList.add('active');

document.querySelectorAll('.nav button').forEach(
b=>b.classList.toggle('active',b.dataset.n===id)
);

scrollTo({
top:0,
behavior:'smooth'
});
}

document.querySelectorAll('.nav button').forEach(
b=>b.onclick=()=>{
render(b.dataset.n);
show(b.dataset.n);
}
);

</div>

${id==='m1'
?'<button class="btn ghost" style="width:100%;margin-top:12px" onclick="startQuiz()">Evaluación M1 · 5 preguntas</button>'
:''
}

`;

show('module');
}

function openLesson(id){

S.currentLesson=id;

let l=L();

S.currentModule=l.moduleId;

save();

renderLesson();

show('lesson');
}

function renderLesson(){

let l=L();

let m=M.find(
x=>x.id===l.moduleId
);

let c=S.checks[l.id];

lesson.innerHTML=`

<div class="lesson">

<span class="back" onclick="openModule('${m.id}')">
← ${m.title}
</span>

<div class="hero">

<div class="k">
${m.n} · ${l.duration} min
</div>

<h1>
${l.title}
</h1>

<p>
${l.objective}
</p>

</div>

<div class="card">

<div class="k">
Concepto
</div>

<h2>
Idea principal
</h2>

<p>
${l.concept}
</p>

</div>

<div class="card" style="margin-top:12px">

<div class="k">
Ejemplo
</div>

<h2>
Aplicado
</h2>

<p>
${l.example}
</p>

</div>

<div class="card" style="margin-top:12px">

<div class="k">
Ahora tú
</div>

<h2>
Micropráctica
</h2>

<p>
${l.practice}
</p>

<textarea id="note">${S.notes[l.id]||''}</textarea>

<button
class="btn ghost"
style="margin-top:9px"
onclick="
S.notes['${l.id}']=note.value;
save();
toast('Nota guardada')
">
Guardar nota
</button>

</div>

<div class="card" style="margin-top:12px">

<div class="k">
Checkpoint
</div>

<h2>
${l.q}
</h2>

${l.opts.map((o,i)=>`

<button
class="option ${c===i?(i===l.ans?'ok':'bad'):''}"
onclick="
S.checks['${l.id}']=${i};
save();
renderLesson()
">
${o}
</button>

`).join('')}

${c!==undefined
?`
<div class="call">
${c===l.ans
?'Correcto. Puedes continuar.'
:'Aún no. Revisa el concepto e inténtalo otra vez.'
}
</div>
`
:''
}

</div>

<div class="row" style="margin:14px 0">

<button
class="btn ${S.completed.includes(l.id)?'success':'primary'}"
onclick="complete('${l.id}')"
>
${S.completed.includes(l.id)
?'✓ Completada'
:'Marcar completada'
}
</button>

<button
class="btn ghost"
onclick="nextLesson('${l.id}')"
>
Siguiente →
</button>

</div>

</div>
`;
}

function complete(id){

if(!S.completed.includes(id)){
S.completed.push(id);
}

save();

toast('Lección completada');

renderLesson();

renderHome();
}

function nextLesson(id){

let a=A();

let i=a.findIndex(
x=>x.id===id
);

if(i<a.length-1){

openLesson(
a[i+1].id
);

}else{

renderProgress();

show('progress');

}
}

let qi=0;

let qa=[];

function startQuiz(){

qi=0;

qa=[];

renderQuiz();

show('quiz');

}

function renderQuiz(){

let q=QUIZ[qi];

quiz.innerHTML=`

<div class="lesson">

<span class="back" onclick="openModule('m1')">
← Módulo 1
</span>

<div class="hero">

<div class="k">
Evaluación M1 · ${qi+1}/5
</div>

<h1>
${q[0]}
</h1>

</div>

<div class="card">

${q[1].map((o,i)=>`

<button
class="option"
onclick="answerQuiz(${i})"
>
${o}
</button>

`).join('')}

</div>

</div>
`;
}

function answerQuiz(i){

qa.push(i);

qi++;

if(qi<QUIZ.length){

renderQuiz();

}else{

let n=QUIZ.reduce(
(s,q,j)=>s+(q[2]===qa[j]?1:0),
0
);

S.quiz=n*2;

save();

quiz.innerHTML=`

<div class="lesson">

<div class="hero">

<div class="k">
Resultado
</div>

<h1>
${S.quiz}/10
</h1>

<p>
${S.quiz>=9
?'Dominio académico excelente.'
:S.quiz>=8
?'Aprobado. Refuerza los fallos.'
:'Conviene repasar el módulo.'
}
</p>

</div>

<button
class="btn primary"
onclick="renderProgress();show('progress')"
>
Ver progreso
</button>

</div>
`;

}
}
function esc(s){

return s.replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[c])
);
}

function renderProfe(){

let l=L();

profe.innerHTML=`

<div class="hero">

<div class="k">
Tutor contextual
</div>

<h1>
✦ Profe!
</h1>

<p>
${l.moduleTitle} · ${l.title}
</p>

</div>

<div class="chat">

${(
S.chat.length
?S.chat
:[
{
role:'assistant',
text:'Estoy viendo tu contexto académico. Puedo explicarte, darte una pista o revisar tu razonamiento sin resolver automáticamente la práctica.'
}
]
).map(
x=>`

<div class="bubble ${x.role}">
${esc(x.text)}
</div>

`
).join('')}

</div>

<div class="chatbar">

<button
class="btn ghost"
onclick="toast('Adjuntos simulados en V1')"
>
＋
</button>

<input
id="chatInput"
placeholder="Pregunta sobre tu lección..."
>

<button
class="btn primary"
onclick="sendChat()"
>
➤
</button>

</div>
`;
}

function sendChat(){

let t=chatInput.value.trim();

if(!t)return;

S.chat.push({
role:'user',
text:t
});

let l=L();

let x=t.toLowerCase();

let r=
x.includes('pista')
?
'Pista: vuelve a la idea principal de la lección y pregúntate qué dato o condición falta antes de actuar.'
:
x.includes('ejemplo')
?
'Ejemplo paralelo: piensa en un pedido de impresión 3D. Separa entrada, validación, decisión y salida.'
:
x.includes('explica')||x.includes('no entiendo')
?
'Reformulación: '+l.concept
:
'Buena pregunta. Antes de darte la solución completa, identifica qué parte ya entiendes. La idea central es: '+l.concept;

S.chat.push({
role:'assistant',
text:r
});

save();

renderProfe();
}

function renderProgress(){

let p=P();

let q=S.quiz;

let d={
Entender:Math.min(
95,
22+p*.9
),
Dirigir:Math.min(
92,
18+p*.75
),
Evaluar:Math.min(
90,
14+p*.7+(q||0)*1.5
),
Construir:Math.min(
88,
8+p*.65
)
};

progress.innerHTML=`

<div class="hero">

<div class="k">
Evidencia de aprendizaje
</div>

<h1>
Progreso
</h1>

<p>
Completion, performance y mastery se mantienen separados.
</p>

</div>

<div class="grid two">

<div class="card accent">

<div class="k">
Máster
</div>

<h2>
${p}%
</h2>

<div class="progress">
<span style="width:${p}%"></span>
</div>

</div>

<div class="card">

<div class="k">
Performance
</div>

<h2>
${q===null
?'Sin evaluación'
:q+'/10'
}
</h2>

<p>
Evaluación M1
</p>

</div>

</div>

<div class="card">

<div class="k">
AI Fluency
</div>

<div class="grid" style="margin-top:10px">

${Object.entries(d).map(
([k,v])=>`

<div class="metric">

<div class="row">

<span>
${k}
</span>

<b>
${Math.round(v)}
</b>

</div>

<div class="progress">
<span style="width:${v}%"></span>
</div>

</div>

`
).join('')}

</div>

</div>

<div class="card">

<div class="k">
Recomendación
</div>

<h2>

${p<15
?'Continúa el Módulo 1'
:q!==null&&q<8
?'Repasa verificación y descomposición'
:'Sigue con la próxima lección'
}

</h2>

<p>
La recomendación usa tu avance y evaluaciones guardadas localmente.
</p>

</div>

<div class="card">

<div class="k">
Portfolio
</div>

<p>

${p<20
?'Tu primer proyecto aparecerá cuando completes suficiente contenido aplicado.'
:'Ya puedes comenzar a documentar tus primeras evidencias.'
}

</p>

</div>
`;
}

function render(id){

if(id==='home'){
renderHome();
}

if(id==='courses'){
renderCourses();
}

if(id==='profe'){
renderProfe();
}

if(id==='progress'){
renderProgress();
}

}

renderHome();

renderCourses();

renderProfe();

renderProgress();

</script>

</body>
</html>
