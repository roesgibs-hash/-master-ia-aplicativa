<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máster IA Aplicativa V2</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#171724;
  --cream:#fff9f3;
  --muted:#707283;
  --line:#e5e4ec;
  --blue:#5b6cff;
  --violet:#8e5cff;
  --aqua:#28d7c0;
  --lime:#bdf34a;
  --coral:#ff705d;
  --yellow:#ffd84a;
  --pink:#ff68b4;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#fffaf5,#f4f2ff);
  color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;
}

.app{
  max-width:980px;
  margin:auto;
  padding-bottom:100px;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:rgba(255,249,243,.84);
  backdrop-filter:blur(16px);
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  font-family:"Plus Jakarta Sans";
  font-weight:800;
}

.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue),var(--pink));
  color:#fff;
  display:grid;
  place-items:center;
  font-size:23px;
  box-shadow:0 10px 28px rgba(91,108,255,.25);
}

.save{
  font-size:12px;
  font-weight:800;
  padding:7px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
}

main{
  padding:0 18px;
}

.screen{
  display:none;
  animation:enter .28s ease;
}

.screen.active{
  display:block;
}

@keyframes enter{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero{
  padding:24px 0 12px;
}

.eyebrow{
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--violet);
}

h1,h2,h3{
  font-family:"Plus Jakarta Sans";
  letter-spacing:-.04em;
}

h1{
  font-size:clamp(40px,8vw,58px);
  line-height:.98;
  margin:8px 0 12px;
}

h2{
  font-size:clamp(26px,5vw,34px);
  margin:6px 0 10px;
}

p{
  color:var(--muted);
  line-height:1.55;
}

.grid{
  display:grid;
  gap:16px;
}

.two{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 18px 50px rgba(42,35,78,.10);
}

.c-blue{
  background:linear-gradient(135deg,#6677ff,#5263f4);
  color:#fff;
  border:0;
}

.c-violet{
  background:linear-gradient(135deg,#8e5cff,#af6cff);
  color:#fff;
  border:0;
}

.c-aqua{
  background:linear-gradient(135deg,#20ccb5,#65e5d3);
  color:#10231f;
  border:0;
}

.c-coral{
  background:linear-gradient(135deg,#ff705d,#ff9988);
  color:#fff;
  border:0;
}

.c-yellow{
  background:linear-gradient(135deg,#ffd84a,#ffe992);
  color:#3b3200;
  border:0;
}

.c-lime{
  background:linear-gradient(135deg,#bdf34a,#e1ff94);
  color:#26310f;
  border:0;
}

.c-blue p,
.c-violet p,
.c-coral p{
  color:rgba(255,255,255,.9);
}

.btn{
  border:0;
  border-radius:16px;
  padding:14px 18px;
  font-weight:800;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:.16s;
}

.btn:active{
  transform:scale(.98);
}

.primary{
  background:var(--ink);
  color:#fff;
}

.white{
  background:#fff;
  color:var(--ink);
}

.soft{
  background:#f1eff6;
  color:var(--ink);
}

.outline{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
}

.nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:12px;
  width:min(94%,700px);
  z-index:40;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border:1px solid var(--line);
  border-radius:24px;
  padding:7px;
  box-shadow:0 18px 55px rgba(31,28,60,.14);
}

.nav button{
  border:0;
  background:transparent;
  color:#7c7e8d;
  border-radius:18px;
  padding:9px 3px;
  font-weight:700;
  font-size:12px;
}

.nav button.active{
  background:var(--ink);
  color:#fff;
}

.nav i{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.progress{
  height:10px;
  border-radius:999px;
  background:rgba(23,23,36,.09);
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--pink));
  transition:.35s;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.chip{
  padding:7px 10px;
  border-radius:999px;
  background:#f1eff6;
  font-size:12px;
  font-weight:800;
}

.module{
  cursor:pointer;
  transition:.16s;
}

.module:hover{
  transform:translateY(-3px);
}

.iconbox{
  width:54px;
  height:54px;
  border-radius:18px;
  background:#f1eff6;
  display:grid;
  place-items:center;
  font-size:28px;
}

.lesson-row{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin:10px 0;
  cursor:pointer;
}

.dot{
  width:36px;
  height:36px;
  border-radius:12px;
  background:#f0eff6;
  display:grid;
  place-items:center;
  font-weight:800;
}

.dot.done{
  background:#dcf9a7;
  color:#27310f;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  color:#5f6274;
  cursor:pointer;
  margin:8px 0 12px;
}

.step{
  max-width:760px;
  margin:auto;
}

.step-card{
  min-height:500px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  position:relative;
}

.step-card:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:44% 56% 61% 39%;
  right:-100px;
  top:-90px;
  background:rgba(255,255,255,.22);
  transform:rotate(25deg);
}

.step-main{
  position:relative;
  z-index:2;
}

.step-icon{
  width:64px;
  height:64px;
  border-radius:20px;
  background:rgba(255,255,255,.82);
  display:grid;
  place-items:center;
  font-size:30px;
  margin:18px 0;
}

.options{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.option{
  border:1px solid rgba(23,23,36,.12);
  background:#fff;
  border-radius:18px;
  padding:15px;
  text-align:left;
  font-weight:800;
  cursor:pointer;
  transition:.16s;
}

.option:hover{
  transform:translateY(-2px);
}

.option.correct{
  border-color:#78d06c;
  background:#efffe6;
}

.option.wrong{
  border-color:#ff9183;
  background:#fff0ed;
}

.feedback{
  margin-top:14px;
  padding:14px 16px;
  border-radius:16px;
  background:rgba(255,255,255,.75);
  font-weight:700;
}

.process{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:18px;
}

.process span{
  background:rgba(255,255,255,.82);
  padding:10px 13px;
  border-radius:14px;
  font-weight:800;
}

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.compare>div{
  background:rgba(255,255,255,.82);
  border-radius:18px;
  padding:16px;
}

.choice-chip{
  display:inline-flex;
  margin:5px;
  padding:9px 12px;
  border:1px solid rgba(23,23,36,.12);
  background:#fff;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.choice-chip.sel{
  background:var(--ink);
  color:#fff;
}

.lesson-progress{
  display:flex;
  gap:6px;
  margin:8px 0 18px;
}

.lesson-progress span{
  height:6px;
  flex:1;
  background:#e6e5ed;
  border-radius:999px;
}

.lesson-progress .done{
  background:var(--aqua);
}

.lesson-progress .active{
  background:var(--violet);
}

.quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.quick button{
  border:0;
  background:#f1efff;
  color:#6347c7;
  border-radius:999px;
  padding:9px 11px;
  font-weight:800;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:43vh;
  margin-top:18px;
}

.bubble{
  max-width:84%;
  padding:13px 15px;
  border-radius:18px;
  line-height:1.5;
}

.assistant{
  background:#f1efff;
  color:#372866;
}

.user{
  align-self:flex-end;
  background:var(--ink);
  color:#fff;
}

.chatbar{
  position:sticky;
  bottom:98px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  background:rgba(255,249,243,.9);
  padding:12px 0;
}

.chatbar input{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
}

.media-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.media-thumb{
  height:120px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--violet),var(--blue));
  display:grid;
  place-items:center;
  color:#fff;
  font-size:42px;
  margin-bottom:12px;
}

.toast{
  position:fixed;
  top:76px;
  left:50%;
  transform:translateX(-50%) translateY(-8px);
  background:var(--ink);
  color:#fff;
  padding:11px 14px;
  border-radius:14px;
  opacity:0;
  transition:.2s;
  z-index:70;
  font-weight:700;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:760px){
  .two,
  .compare,
  .media-grid{
    grid-template-columns:1fr;
  }

  .step-card{
    min-height:480px;
  }

  main{
    padding:0 14px;
  }

  .top{
    padding:12px 14px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="brand">

    <div class="logo">
      <i class="ti ti-sparkles"></i>
    </div>

    <div>
      Máster IA Aplicativa

      <div style="font:700 12px Manrope;color:#7c7e8d">
        V2 · Learning Motion UI
      </div>

    </div>

  </div>

  <div class="save" id="saveBadge">
    Guardado local
  </div>

</header>

<main>

<section id="home" class="screen active"></section>

<section id="courses" class="screen"></section>

<section id="profe" class="screen"></section>

<section id="progress" class="screen"></section>

<section id="module" class="screen"></section>

<section id="lesson" class="screen"></section>

<section id="media" class="screen"></section>

</main>

</div>

<nav class="nav">

<button data-nav="home" class="active">
<i class="ti ti-home"></i>
Home
</button>

<button data-nav="courses">
<i class="ti ti-books"></i>
Cursos
</button>

<button data-nav="profe">
<i class="ti ti-sparkles"></i>
Profe!
</button>

<button data-nav="progress">
<i class="ti ti-chart-line"></i>
Progreso
</button>

</nav>

<div id="toast" class="toast"></div>

<script>
const MODULES=[

{
id:"m1",
n:"01",
title:"Fundamentos de IA",
icon:"ti ti-brain",
color:"blue",
desc:"Entiende LLM, verificación, contexto y elección de herramientas.",
skills:["AI Literacy","Verification"],

lessons:[

{
id:"m1l1",
title:"¿Chatbot, automatización o agente?",
duration:12,

steps:[

{
t:"hook",
title:"¿Esto es IA?",
body:"Cuando llega un formulario, se envía automáticamente un email.",
opts:["Sí","No","Depende"],
a:2,
fb:"Puede formar parte de un sistema con IA, pero ese comportamiento concreto es una automatización."
},

{
t:"process",
title:"Automatización",
body:"Sigue un camino previamente definido.",
icon:"ti ti-bolt",
process:["Evento","Regla","Acción"]
},

{
t:"process",
title:"Agente",
body:"Persigue un objetivo y puede elegir acciones dentro de límites.",
icon:"ti ti-robot",
process:["Objetivo","Decide","Usa herramienta","Revisa"]
},

{
t:"choice",
title:"Tú decides",
body:"El sistema detecta que falta el color y decide preguntárselo al cliente.",
opts:["Chatbot","Automatización","Agente"],
a:2,
fb:"Aquí existe una decisión basada en el estado del pedido."
},

{
t:"compare",
title:"Compáralos",
left:[
"AUTOMATIZACIÓN",
"Reglas conocidas",
"Predecible",
"Repetitiva"
],
right:[
"AGENTE",
"Decide entre acciones",
"Usa herramientas",
"Persigue un objetivo"
]
},

{
t:"recap",
title:"Automatización ≠ Agente",
body:"Automatización = reglas. Agente = decisiones dentro de límites.",
skill:"AI Literacy +1"
}

]
},

{
id:"m1l2",
title:"¿Por qué una IA puede sonar segura y equivocarse?",
duration:15,

steps:[

{
t:"hook",
title:"¿Seguro = correcto?",
body:"Una IA responde con mucha seguridad. ¿Eso significa que tiene razón?",
opts:["Sí","No","Solo si explica mucho"],
a:1,
fb:"No. El tono seguro no garantiza exactitud."
},

{
t:"process",
title:"Cómo genera",
body:"Un LLM genera texto a partir del contexto y patrones aprendidos.",
icon:"ti ti-brain",
process:["Contexto","Patrones","Respuesta probable"]
},

{
t:"insight",
title:"Fluidez ≠ verdad",
body:"Un texto puede ser elegante, detallado y aun así estar equivocado."
},

{
t:"choice",
title:"Caso crítico",
body:"Una IA te dice que un trámite migratorio puede hacerse con cierto documento. ¿Qué haces?",
opts:[
"Actuar",
"Pedir más seguridad",
"Buscar fuente oficial actual"
],
a:2,
fb:"Correcto: cuando el impacto es alto, verifica."
},

{
t:"recap",
title:"La confianza visual no es evidencia",
body:"Cuanto mayor sea el impacto o la actualidad, mayor debe ser la verificación.",
skill:"Verification +1"
}

]
},

{
id:"m1l3",
title:"El contexto cambia la respuesta",
duration:15,

steps:[

{
t:"compare",
title:"¿Cuál permite responder mejor?",
left:[
"A",
"Recomiéndame material."
],
right:[
"B",
"Pieza exterior",
"Resistente a humedad",
"Calor moderado"
]
},

{
t:"builder",
title:"Construye contexto útil",
body:"Selecciona lo que ayuda a diseñar un soporte.",
choices:[
"Peso que debe soportar",
"Material disponible",
"Ambiente de uso",
"Signo zodiacal",
"Color favorito"
],
correct:[0,1,2]
},

{
t:"choice",
title:"¿Qué falta?",
body:"Organízame los pedidos.",
opts:[
"Criterio de orden",
"Datos disponibles",
"Formato esperado",
"Todas"
],
a:3,
fb:"Exacto: falta definir cómo organizar, con qué datos y cómo entregar."
},

{
t:"recap",
title:"Mejor contexto ≠ más texto",
body:"Significa información relevante que reduce ambigüedad.",
skill:"Context Management +1"
}

]
},

{
id:"m1l4",
title:"Cuándo debes verificar",
duration:18,

steps:[

{
t:"builder",
title:"¿Qué verificarías primero?",
body:"Selecciona lo actual o de alto impacto.",
choices:[
"Precio actual de una impresora",
"Definición de triángulo",
"Normativa publicada esta semana",
"Dosis de un medicamento"
],
correct:[0,2,3]
},

{
t:"insight",
title:"No inventes no verifica",
body:"La instrucción ayuda, pero la evidencia confirma."
},

{
t:"choice",
title:"Caso REG3D",
body:"Necesitas la temperatura recomendada de un filamento concreto. ¿Qué fuente buscarías primero?",
opts:[
"Comentario antiguo",
"Fabricante",
"Respuesta sin fuente"
],
a:1,
fb:"Empieza por la fuente primaria adecuada."
},

{
t:"recap",
title:"Afirmación → evidencia → fuente → fecha",
body:"Ese será tu patrón de verificación.",
skill:"Verification +1"
}

]
},

{
id:"m1l5",
title:"Elegir la herramienta correcta",
duration:18,

steps:[

{
t:"hook",
title:"¿IA para todo?",
body:"¿La herramienta más avanzada siempre es la mejor?",
opts:["Sí","No"],
a:1,
fb:"No. La mejor herramienta es la que resuelve mejor el problema."
},

{
t:"match",
title:"Haz el matching",
pairs:[
["Precio actual","Search"],
["Geometría paramétrica","CAD"],
["Confirmación tras formulario","Automatización"],
["Comprender un concepto","Chat"]
]
},

{
t:"choice",
title:"Decisión con impacto",
body:"El sistema debe comprometer una fecha de entrega.",
opts:[
"Automatizar sin revisión",
"Aprobación humana",
"Prompt más largo"
],
a:1,
fb:"Correcto: ciertas decisiones necesitan control humano."
},

{
t:"recap",
title:"La herramienta correcta > la herramienta de moda",
body:"Piensa primero en el problema.",
skill:"AI Literacy +1"
}

]
},

{
id:"m1l6",
title:"Descomponer antes de automatizar",
duration:15,

steps:[

{
t:"hook",
title:"Automatiza mi negocio",
body:"¿Qué problema tiene?",
opts:[
"Es demasiado amplia",
"Necesita emojis",
"Debe estar en inglés"
],
a:0,
fb:"Antes hay que separar procesos y decisiones."
},

{
t:"process",
title:"Gestionar pedido",
body:"Un objetivo grande se divide en un flujo.",
icon:"ti ti-route",
process:[
"Recibir",
"Validar",
"Presupuestar",
"Fabricar",
"Informar",
"Entregar"
]
},

{
t:"choice",
title:"¿Qué automatizarías primero?",
body:"Selecciona la parte más determinista.",
opts:[
"Registrar pedido",
"Decidir viabilidad técnica",
"Comprometer precio final"
],
a:0,
fb:"Registrar suele tener reglas claras y repetibles."
},

{
t:"recap",
title:"Divide antes de automatizar",
body:"Entradas → decisiones → acciones → salidas.",
skill:"Problem Decomposition +1"
}

]
}

]
},

{
id:"m2",
n:"02",
title:"Prompting profesional",
icon:"ti ti-target-arrow",
color:"violet",
desc:"Diseña instrucciones claras, controlables y reutilizables.",
skills:["Prompting","Evaluation"],

lessons:[

{
id:"m2l1",
title:"¿Qué hace bueno a un prompt?",
duration:16,

steps:[

{
t:"choice",
title:"¿Cuál pedirías tú?",
body:"A: Hazme un presupuesto.\nB: Calcula 20 piezas PLA considerando material, horas y margen del 30%. Devuelve tabla.",
opts:["A","B"],
a:1,
fb:"B define tarea, contexto y resultado esperado."
},

{
t:"process",
title:"La fórmula base",
body:"Tres piezas reducen la ambigüedad.",
icon:"ti ti-puzzle",
process:["Tarea","Contexto","Resultado"]
},

{
t:"builder",
title:"Construye un prompt",
body:"Selecciona lo útil para comparar filamentos.",
choices:[
"Comparar materiales",
"Uso exterior",
"Propiedades",
"Una canción",
"Devolver tabla"
],
correct:[0,1,2,4]
},

{
t:"recap",
title:"Un buen prompt reduce ambigüedad",
body:"Tarea + contexto + resultado esperado.",
skill:"Prompting +1"
}

]
},

{
id:"m2l2",
title:"Objetivos y restricciones",
duration:18,

steps:[

{
t:"choice",
title:"Diseña un soporte",
body:"¿Qué falta?",
opts:[
"Función",
"Límites",
"Contexto",
"Todas"
],
a:3,
fb:"Correcto: hay demasiadas decisiones abiertas."
},

{
t:"builder",
title:"Contexto para exterior",
body:"Selecciona datos relevantes.",
choices:[
"Temperatura",
"Humedad",
"UV",
"Color favorito",
"Facilidad de impresión"
],
correct:[0,1,2,4]
},

function allLessons(){

return MODULES.flatMap(

module=>

module.lessons.map(

lesson=>({
...lesson,
moduleId:module.id,
moduleTitle:module.title
})

)

);

}

function CL(){

return allLessons().find(
lesson=>lesson.id===S.currentLesson
)
||
allLessons()[0];

}

function mp(module){

if(!module.lessons.length){
return 0;
}

const done=
module.lessons.filter(
lesson=>
S.completed.includes(
lesson.id
)
).length;

return Math.round(
done/module.lessons.length*100
);

}

function total(){

const lessons=allLessons();

if(!lessons.length){
return 0;
}

return Math.round(
S.completed.length/
lessons.length*
100
);

}

:
""
}

if(step.icon){

html+=`

<div class="step-icon">

<i class="${step.icon}"></i>

</div>

`;

}

if(step.process){

html+=`

<div class="process">

${step.process.map(

(item,index)=>`

${
index
?
"<span>→</span>"

""
}

).join("")}

</div>

}

if(step.opts){

html+=`

<div class="options">

${step.opts.map(

(option,index)=>`

<button
class="

${
answer===index
?
index===step.a
?
"correct"
:
"wrong"
:
""
}
"
onclick="answer(${index})">

${option}

</button>

`

).join("")}

</div>

${
answer!==undefined
?
`

<div class="feedback">

${
answer===step.a
?
"✓ "+step.fb
:
"Casi. "+step.fb
}

</div>

`
:
""
}

`;

}

if(step.left){

html+=`

<div class="compare">

<div>

<b>
${step.left[0]}
</b>

${step.left.slice(1).map(

item=>`

<p style="color:inherit">
${item}
</p>

`

).join("")}

</div>

<div>

<b>
${step.right[0]}
</b>

${step.right.slice(1).map(

item=>`

<p style="color:inherit">
${item}
</p>

`

).join("")}

</div>

</div>

`;

}

if(step.choices){

const selected=
S.builder[key]||[];

html+=`

<div style="margin-top:14px">

${step.choices.map(

(item,index)=>`

<button
class="
choice-chip
${
selected.includes(index)
?
"sel"

}

onclick="toggle(${index})">

`

).join("")}

</div>

${
selected.length
?
`

<div class="feedback">

${
JSON.stringify(
[...selected].sort()
)
===
JSON.stringify(
[...step.correct].sort()
)

?
"✓ Buena selección."
:
"Sigue afinando la selección."
}

</div>

`
:
""
}

`;

}

if(step.pairs){

html+=`

<div class="compare">

${step.pairs.map(

pair=>`

<div>

<b>
${pair[0]}
</b>

${pair[1]}

</div>

`

).join("")}

</div>

`;

}

if(step.skill){

html+=`

}

html+=`

Continuar

function answer(index){

S.answers[
CL().id+"_"+S.step
]=index;

save();

renderLesson();

}

function toggle(index){

const key=
CL().id+"_"+S.step;

const current=
S.builder[key]||[];

S.builder[key]=
current.includes(index)

?
current.filter(
item=>item!==index
)

:
[
...current,
index
];

save();

renderLesson();

}

function nextStep(){

const lesson=CL();

S.step=
Math.min(
S.step+1,
lesson.steps.length-1
);

save();

renderLesson();

}

function prevStep(){

S.step=
Math.max(
0,
S.step-1
);

save();

renderLesson();

}

function finishLesson(){

const lesson=CL();

if(
!S.completed.includes(
lesson.id
)
){

S.completed.push(
lesson.id
);

}

save();

toast(
"Lección completada ✓"
);

renderProgress();

show(
"progress"
);

}

$("#chatInput");

const text=
input.value.trim();

if(!text){
return;

S.chat.push(
{
role:"user",

}
);

function reply(text){

const lesson=CL();

const normalized=
text.toLowerCase();

let response;

if(
normalized.includes("pista")
){

response=
"Pista: elimina primero las opciones que no cambian la decisión.";

}

else if(
normalized.includes("ejemplo")
){

response=
"Ejemplo: piensa en un pedido 3D y separa datos, reglas y decisiones.";

}

else if(
normalized.includes("practicar")
){

response=
"Reto: crea un caso para automatización y otro para agente.";

}

else{

response=
"Versión simple: "+
(
lesson.steps[S.step].body
||
lesson.steps[S.step].title
);

}

S.chat.push(
{
role:"assistant",
text:response
}
);

save();

renderProfe();

}
